[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyopt"
version = "1.1.0"
description = "Discrete optimization toolkit for bounded integer-tuple search spaces"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    {name = "Elijah Sheridan"},
    {name = "Andreas Schachner"},
    {name = "Nate MacFadden"},
]
keywords = ["calabi-yau", "frst", "discrete optimization", "genetic algorithm", "cytools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm>=4.60",
]

[project.optional-dependencies]
frst = ["cytools"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.0",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-togglebutton>=0.3",
    "sphinx-design>=0.5",
]

[project.urls]
Homepage = "https://github.com/sheride/cyopt"
Repository = "https://github.com/sheride/cyopt"
Issues = "https://github.com/sheride/cyopt/issues"
Documentation = "https://cyopt.readthedocs.io"
Changelog = "https://github.com/sheride/cyopt/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["cyopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
